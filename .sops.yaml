# SOPS configuration — tells `sops` which encryption key to use for which
# files. Secrets are encrypted with an AWS KMS key dedicated to this project,
# because the rest of this project already lives on AWS (S3, CloudFront,
# Lambda, Terraform state) and IAM is the natural access-control point.
#
# See docs/deployment.md § Secrets management for the full workflow. See
# docs/security.md § Risk 8 for the threat model.
#
# ---------------------------------------------------------------------------
# First-time setup
# ---------------------------------------------------------------------------
#
# Run `bin/sops-init.sh` once. It will:
#   1. Verify aws CLI auth and sops are installed
#   2. Create a KMS key + alias (alias/meryl-green-designs-sops) in af-south-1
#      IF one doesn't already exist — idempotent on re-run
#   3. Write the key's alias ARN into the placeholders below
#   4. Seed empty encrypted files from the examples
#
# Anyone with `kms:Decrypt` permission on the project's KMS key can read the
# secrets. That means you (on your laptop, via the default AWS credential
# chain) and any CI workflow that assumes a role with decrypt permission
# (currently none — CI only deploys code, it doesn't touch secrets).
#
# ---------------------------------------------------------------------------
# What's encrypted
# ---------------------------------------------------------------------------
#
# - infra/terraform.tfvars.sops   — AWS + Resend + Sanity tokens (prod)
# - backend/.env.sops              — same secrets for local dev via tsx
#
# Plaintext sibling files (infra/terraform.tfvars, backend/.env) are
# gitignored. They exist only as decrypted scratch copies while you run
# `terraform apply` or `pnpm dev`.
#
# ---------------------------------------------------------------------------
# Why KMS and not age
# ---------------------------------------------------------------------------
#
# - No key file on disk to lose. Access is bound to AWS IAM, so recovery
#   from laptop loss is "log in on a new machine, aws configure, decrypt."
# - CloudTrail logs every kms:Decrypt call — there's an audit trail of when
#   and from where secrets were accessed.
# - Aligns with the existing AWS-centric architecture. One more resource
#   (a $1/month KMS key) rather than a new trust system.
# - CI workflows that ever need to decrypt can do so via the existing OIDC
#   role — no new secrets to manage.
#
# ---------------------------------------------------------------------------
# Recipients
# ---------------------------------------------------------------------------
#
# The placeholder ARN below is replaced by bin/sops-init.sh after it creates
# (or discovers) the project's KMS key. To add a second operator, edit the
# KMS key policy in the AWS console to grant them kms:Decrypt and
# kms:Encrypt — no changes to this file are needed, and no re-encryption is
# required. IAM is the source of truth for access.
#
# To rotate the KMS key itself:
#   1. Create a new key (or let AWS auto-rotate the key material annually).
#   2. Update the alias to point at the new key:
#        aws kms update-alias --alias-name alias/meryl-green-designs-sops \
#          --target-key-id <new-key-id>
#   3. Run `sops updatekeys infra/terraform.tfvars.sops` and the same for
#      backend/.env.sops to re-encrypt with the new key material.
#
# Because the alias resolves at decrypt time, SOPS keeps working with just
# the alias update — but `updatekeys` is required to re-encrypt under the
# new key.

creation_rules:
  # Both files encrypt as binary blobs (SOPS default for unrecognized
  # extensions). Diffs in git are opaque — you can't see which individual
  # secret rotated without decrypting both versions. Acceptable for the
  # rare-rotation cadence on this project.
  - path_regex: infra/terraform\.tfvars\.sops$
    kms: 'arn:aws:kms:KMS_REGION_PLACEHOLDER:KMS_ACCOUNT_PLACEHOLDER:alias/meryl-green-designs-sops'

  - path_regex: backend/\.env\.sops$
    kms: 'arn:aws:kms:KMS_REGION_PLACEHOLDER:KMS_ACCOUNT_PLACEHOLDER:alias/meryl-green-designs-sops'
