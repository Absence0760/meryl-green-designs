# Local development services. Production runs on AWS — see infra/.
#
# Bring up: docker compose up -d   (or `pnpm dev:db:up` for the full
# one-shot bootstrap that also creates the orders table).
# Tear down: docker compose down
#
# We use LocalStack (Python ASGI server) rather than amazon/dynamodb-
# local (Java/Jetty). Both emulate the DynamoDB API; LocalStack was
# chosen because amazon/dynamodb-local + Jetty 12 reproducibly hangs
# the AWS SDK/CLI's HTTP layer on Fedora 43 / kernel 6.19 (curl works
# but the SDK never receives the response).
#
# Only the DynamoDB service is enabled — see SERVICES below. The
# LocalStack edge endpoint listens on :4566 for every AWS service.
# Data is stored under /var/lib/localstack inside the container and
# survives restarts via the named volume.

services:
  localstack:
    image: localstack/localstack:3.8
    container_name: meryl-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb
      - DEBUG=0
      # Persist DynamoDB tables across container restarts. `docker
      # compose down -v` to wipe.
      - PERSISTENCE=1
    volumes:
      - localstack-data:/var/lib/localstack
    restart: unless-stopped

volumes:
  localstack-data:
