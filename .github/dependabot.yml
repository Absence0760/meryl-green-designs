# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Strategy:
# - ONE npm entry at the workspace root, not one per workspace package.
#   This is a pnpm workspace with a single root `pnpm-lock.yaml`. Pointed at
#   `/frontend`, `/backend`, etc., Dependabot finds no lockfile in that
#   directory, rewrites only the workspace `package.json`, and leaves the
#   root lockfile stale — every such PR then fails `ci.yml`'s
#   `pnpm install --frozen-lockfile` (ERR_PNPM_OUTDATED_LOCKFILE). From `/`
#   Dependabot reads `pnpm-workspace.yaml`, bumps the dependency in every
#   workspace that declares it, and regenerates the root lockfile in the
#   same commit. No lockfile-sync workflow is needed.
# - One entry for GitHub Actions workflows and one for the Terraform
#   providers under infra/.
# - Weekly, on Monday morning South Africa time — low noise, predictable.
# - Related packages are grouped so they move together (e.g. svelte ecosystem,
#   sanity ecosystem, react + types). Everything else is bundled into a single
#   "minor-and-patch" group so you get a handful of PRs per week instead of
#   dozens. A package matches the first group whose patterns fit it.
# - Major version bumps for ungrouped packages open as individual PRs and
#   require review — see pnpm-outdated-safe-bumps discussion in docs/roadmap.md.

version: 2
updates:
  # ---------------------------------------------------------------------------
  # npm — the whole pnpm workspace (frontend, backend, studio, playwright)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      svelte-ecosystem:
        patterns:
          - "svelte"
          - "svelte-*"
          - "@sveltejs/*"
      sanity:
        patterns:
          - "@sanity/*"
          - "sanity"
      hono:
        patterns:
          - "hono"
          - "@hono/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright"
      types:
        patterns:
          - "@types/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # GitHub Actions workflows
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      all-actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Terraform (infra/)
  # ---------------------------------------------------------------------------
  # Tracks the AWS provider lock in `infra/.terraform.lock.hcl`. Dependabot
  # only bumps provider versions here (not the `required_version` for the
  # terraform binary itself); bump that manually when a stack-wide upgrade
  # is intentional. Aligned with the new workflows/terraform.yml gate.
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(infra)"
      include: "scope"
