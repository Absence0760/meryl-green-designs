name: Deploy frontend

# Release-gated for code changes: deploys only fire when a GitHub release is
# published. The repository_dispatch trigger is kept so Sanity content edits
# (via the publish webhook — see docs/deployment.md) still rebuild the static
# site without requiring a code release. workflow_dispatch remains for manual
# re-runs.
on:
  release:
    types: [published]
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to deploy frontend
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Manual dispatch AND Sanity content-rebuild events always deploy.
          # Content changes don't show up in git, so skip-if-unchanged can't
          # see them and would incorrectly skip the rebuild.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" \
             || "${GITHUB_EVENT_NAME}" == "repository_dispatch" ]]; then
            echo "Triggered by ${GITHUB_EVENT_NAME} — deploying unconditionally."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_TAG="${GITHUB_REF_NAME}"
          echo "Current release tag: $CURRENT_TAG"

          PREV_TAG=$(gh release list --exclude-drafts --limit 10 --json tagName \
            --jq ".[] | select(.tagName != \"$CURRENT_TAG\") | .tagName" \
            | head -n 1 || true)

          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous release found — deploying (first release)."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Previous release tag: $PREV_TAG"
          git fetch --tags --quiet

          CHANGED=$(git diff --name-only "$PREV_TAG..$CURRENT_TAG" -- \
            'frontend/' \
            'pnpm-lock.yaml' \
            '.github/workflows/deploy-frontend.yml' \
            || true)

          if [[ -n "$CHANGED" ]]; then
            echo "Frontend files changed since $PREV_TAG:"
            echo "$CHANGED" | sed 's/^/  /'
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No frontend files changed between $PREV_TAG and $CURRENT_TAG — skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
        run: pnpm build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync build output to S3
        run: |
          aws s3 sync frontend/build/ "s3://${{ vars.FRONTEND_BUCKET }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.txt"

      - name: Sync HTML with shorter cache
        run: |
          aws s3 sync frontend/build/ "s3://${{ vars.FRONTEND_BUCKET }}/" \
            --delete \
            --cache-control "public, max-age=60, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.xml" \
            --include "*.txt"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
