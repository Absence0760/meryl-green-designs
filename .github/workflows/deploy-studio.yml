name: Deploy studio

# Release-gated: deploys only fire when a GitHub release is published.
# workflow_dispatch is kept for manual re-runs.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-studio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to deploy studio
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Triggered by workflow_dispatch — deploying unconditionally."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_TAG="${GITHUB_REF_NAME}"
          echo "Current release tag: $CURRENT_TAG"

          PREV_TAG=$(gh release list --exclude-drafts --limit 10 --json tagName \
            --jq ".[] | select(.tagName != \"$CURRENT_TAG\") | .tagName" \
            | head -n 1 || true)

          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous release found — deploying (first release)."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Previous release tag: $PREV_TAG"
          git fetch --tags --quiet

          CHANGED=$(git diff --name-only "$PREV_TAG..$CURRENT_TAG" -- \
            'studio/' \
            'pnpm-lock.yaml' \
            '.github/workflows/deploy-studio.yml' \
            || true)

          if [[ -n "$CHANGED" ]]; then
            echo "Studio files changed since $PREV_TAG:"
            echo "$CHANGED" | sed 's/^/  /'
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No studio files changed between $PREV_TAG and $CURRENT_TAG — skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert required production env is set
        # Fail fast (before sanity deploy actually builds) if either of
        # the Studio-bound prod vars is missing. The orderPii.tsx
        # bundle throws on a missing/loopback API URL when NODE_ENV is
        # production, but catching it here gives the operator a
        # clearer error than a generic build crash.
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${PUBLIC_API_URL}" ] || missing+=("vars.PUBLIC_API_URL")
          [ -n "${ADMIN_API_TOKEN}" ] || missing+=("secrets.ADMIN_API_TOKEN")
          [ -n "${PUBLIC_SANITY_PROJECT_ID}" ] || missing+=("vars.PUBLIC_SANITY_PROJECT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required values in the production environment: ${missing[*]}"
            echo "Set them at https://github.com/<owner>/<repo>/settings/environments/production"
            exit 1
          fi

      - name: Deploy studio to Sanity
        working-directory: studio
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          # Baked into the Studio JS bundle at build time. The token gates
          # /admin/* on the backend (same value as the Lambda's
          # ADMIN_API_TOKEN); the API URL is where the custom PII panels
          # send their requests. Both are visible in the deployed bundle —
          # the backend bearer check is the actual security gate.
          # See docs/orders-pii-split.md § Admin auth.
          SANITY_STUDIO_ADMIN_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          SANITY_STUDIO_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: pnpm exec sanity deploy
