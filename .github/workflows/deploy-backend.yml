name: Deploy backend

# Release-gated: deploys only fire when a GitHub release is published.
# workflow_dispatch is kept so you can manually re-run the deploy against the
# current `main` (for hotfixes, rollbacks after a flaky AWS call, or
# re-running a failed step) without cutting a new release.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: backend
        run: pnpm check

      - name: Build Lambda bundle
        working-directory: backend
        run: pnpm build

      - name: Package Lambda zip
        working-directory: backend
        run: |
          cd dist
          zip -9 lambda.zip lambda.mjs
          ls -lh lambda.zip

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --zip-file "fileb://backend/dist/lambda.zip" \
            --publish
