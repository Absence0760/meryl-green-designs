name: Deploy backend

# Release-gated: deploys only fire when a GitHub release is published.
# workflow_dispatch is kept so you can manually re-run the deploy against the
# current `main` (for hotfixes, rollbacks after a flaky AWS call, or
# re-running a failed step) without cutting a new release.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # Skip-if-unchanged: a release fires all three deploy workflows, but we
  # only want to actually deploy workspaces whose files changed since the
  # previous release. This check job decides whether the deploy job runs.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to deploy backend
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Manual dispatch always deploys — matches operator intent.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Triggered by workflow_dispatch — deploying unconditionally."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_TAG="${GITHUB_REF_NAME}"
          echo "Current release tag: $CURRENT_TAG"

          PREV_TAG=$(gh release list --exclude-drafts --limit 10 --json tagName \
            --jq ".[] | select(.tagName != \"$CURRENT_TAG\") | .tagName" \
            | head -n 1 || true)

          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous release found — deploying (first release)."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Previous release tag: $PREV_TAG"
          git fetch --tags --quiet

          CHANGED=$(git diff --name-only "$PREV_TAG..$CURRENT_TAG" -- \
            'backend/' \
            'pnpm-lock.yaml' \
            '.github/workflows/deploy-backend.yml' \
            || true)

          if [[ -n "$CHANGED" ]]; then
            echo "Backend files changed since $PREV_TAG:"
            echo "$CHANGED" | sed 's/^/  /'
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend files changed between $PREV_TAG and $CURRENT_TAG — skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: backend
        run: pnpm check

      - name: Build Lambda bundles (HTTP + auto-cancel)
        working-directory: backend
        # `pnpm build` runs both `build:lambda` (dist/lambda.mjs — the
        # main HTTP handler) and `build:auto-cancel` (dist/auto-cancel.mjs
        # — the daily EventBridge-scheduled Sanity sweep). Two separate
        # Lambda functions, two separate code uploads below.
        run: pnpm build

      - name: Package Lambda zips
        working-directory: backend
        run: |
          cd dist
          zip -9 lambda.zip lambda.mjs
          zip -9 auto-cancel.zip auto-cancel.mjs
          ls -lh lambda.zip auto-cancel.zip

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update main backend Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --zip-file "fileb://backend/dist/lambda.zip" \
            --publish

      - name: Update auto-cancel Lambda code
        # Function name is fixed by Terraform (`${local.project}-auto-cancel`
        # in infra/auto_cancel.tf), so this is hardcoded rather than pulled
        # from a GitHub Actions variable. If the project local renames, both
        # sides update together.
        #
        # Pre-flight check: confirm the function actually exists in AWS
        # before attempting the code upload. The auto-cancel Lambda is
        # provisioned by Terraform (infra/auto_cancel.tf), so the very
        # first release after that file landed needs `terraform apply`
        # to have run first. Without this guard, `update-function-code`
        # against a non-existent function returns ResourceNotFoundException
        # mid-job and the deploy fails with a cryptic AWS error. The
        # check below fails fast with an actionable message instead.
        run: |
          set -euo pipefail
          AUTO_CANCEL_FN="meryl-green-designs-auto-cancel"
          if ! aws lambda get-function --function-name "$AUTO_CANCEL_FN" >/dev/null 2>&1; then
            echo "::error::Lambda '$AUTO_CANCEL_FN' does not exist yet. Run 'cd infra && terraform apply' to create it before publishing a release that includes the daily auto-cancel feature. See docs/deployment.md § Release runbook."
            exit 1
          fi
          aws lambda update-function-code \
            --function-name "$AUTO_CANCEL_FN" \
            --zip-file "fileb://backend/dist/auto-cancel.zip" \
            --publish
