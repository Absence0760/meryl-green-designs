name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (LocalStack + test-e2e Sanity)
    runs-on: ubuntu-latest
    # Use the dedicated 'e2e' GitHub Actions environment so the SANITY_E2E_*
    # secrets/vars are isolated from the 'production' environment that the
    # deploy workflows use. The env-guard in playwright/global-setup.ts
    # rejects anything that looks like prod regardless, but isolation is
    # belt-and-braces.
    environment: e2e
    timeout-minutes: 20

    services:
      # LocalStack DynamoDB emulator. The localstack/localstack:3.8 image
      # matches what docker-compose.yml uses locally so behavioural drift
      # between local and CI stays minimal.
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: dynamodb
          DEBUG: '0'
        ports:
          - 4566:4566
        # Health check so jobs that depend on this service wait for ready
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # --- Sanity (test-e2e dataset) ---
      SANITY_PROJECT_ID: ${{ vars.SANITY_E2E_PROJECT_ID }}
      SANITY_DATASET: ${{ vars.SANITY_E2E_DATASET }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_E2E_TOKEN }}
      SANITY_WEBHOOK_SECRET: ${{ secrets.SANITY_E2E_WEBHOOK_SECRET }}

      # --- DynamoDB (LocalStack only) ---
      ORDERS_TABLE_NAME: meryl-green-designs-orders
      DYNAMODB_ENDPOINT: http://localhost:4566

      # --- Email (file backend) ---
      EMAIL_BACKEND: file
      FROM_EMAIL: orders@e2e.local
      OWNER_EMAIL: owner@e2e.local

      # --- PayFast (public sandbox merchant — safe to commit) ---
      PAYFAST_SANDBOX: 'true'
      PAYFAST_MERCHANT_ID: '10004002'
      PAYFAST_MERCHANT_KEY: q1cd2rdny4a53
      PAYFAST_PASSPHRASE: payfast

      # --- Admin token (any high-entropy string is fine for tests) ---
      ADMIN_API_TOKEN: ${{ secrets.E2E_ADMIN_API_TOKEN }}

      # --- Site URLs (loopback only) ---
      SITE_URL: http://localhost:7777
      API_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Refuse to run with prod-shaped secrets
        # First defence: if anyone wires the production environment to this
        # workflow by accident, fail before pnpm install. The env-guard in
        # global-setup.ts is the second defence.
        run: |
          set -e
          if [ "${SANITY_DATASET:-}" = "production" ]; then
            echo "::error::SANITY_DATASET=production is forbidden in the e2e job"
            exit 1
          fi
          case "${DYNAMODB_ENDPOINT:-}" in
            http://localhost:*|http://127.0.0.1:*|http://0.0.0.0:*) ;;
            *) echo "::error::DYNAMODB_ENDPOINT must be loopback (got: ${DYNAMODB_ENDPOINT:-<unset>})"; exit 1 ;;
          esac
          if [ "${PAYFAST_SANDBOX:-}" != "true" ]; then
            echo "::error::PAYFAST_SANDBOX must be 'true'"
            exit 1
          fi
          if [ "${EMAIL_BACKEND:-}" != "file" ]; then
            echo "::error::EMAIL_BACKEND must be 'file'"
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('playwright/package.json') }}

      - name: Install Playwright (chromium only)
        run: pnpm --filter @meryl-green-designs/playwright exec playwright install --with-deps chromium

      - name: Seed frontend .env so the dev server boots with the test API URL
        run: |
          cat > frontend/.env <<EOF
          PUBLIC_API_URL=$API_URL
          PUBLIC_SITE_URL=$SITE_URL
          PUBLIC_SANITY_PROJECT_ID=$SANITY_PROJECT_ID
          PUBLIC_SANITY_DATASET=$SANITY_DATASET
          EOF

      - name: Wait for LocalStack to report DynamoDB ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health | grep -qE '"dynamodb"\s*:\s*"(available|running)"'; then
              echo "LocalStack ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::LocalStack didn't report DynamoDB ready within 60 s"
          exit 1

      - name: Create the orders table in LocalStack
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_DEFAULT_REGION: af-south-1
        run: |
          aws --endpoint-url http://localhost:4566 dynamodb create-table \
            --table-name "$ORDERS_TABLE_NAME" \
            --attribute-definitions AttributeName=orderRef,AttributeType=S \
            --key-schema AttributeName=orderRef,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST > /dev/null
          aws --endpoint-url http://localhost:4566 dynamodb update-time-to-live \
            --table-name "$ORDERS_TABLE_NAME" \
            --time-to-live-specification "Enabled=true, AttributeName=ttl" > /dev/null

      - name: Run Playwright suite
        run: pnpm --filter @meryl-green-designs/playwright test

      - name: Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright/playwright-report
          retention-days: 7

      - name: Upload captured emails (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: captured-emails
          path: backend/.dev-emails
          retention-days: 3

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [playwright]
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
