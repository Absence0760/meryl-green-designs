name: Terraform

# Guards the `infra/` stack against three classes of regression:
#   1. `terraform fmt` drift — keeps the formatter idempotent so the
#      PR diff is the real change, not whitespace churn.
#   2. `terraform validate` — syntax + provider-version + ref-shape
#      checks. Doesn't touch state (we pass `-backend=false`), so the
#      check can run without AWS credentials.
#   3. Trivy IaC mode — known-bad patterns (public S3 buckets, IAM
#      `Action: *`, security-group 0.0.0.0/0 ingress, missing
#      encryption-at-rest, etc.). Cheaper to surface in CI than
#      discover after `terraform apply`.
#
# Runs on every PR that touches `infra/` and on every push to main.
# Path-filtered so docs-only edits don't churn the workflow queue.
#
# The infra is a single flat stack under `infra/` (S3 + CloudFront +
# Lambda + API Gateway + DynamoDB + ACM + Route 53 + OIDC). Two-provider
# setup (`aws` primary in af-south-1 + `aws.us_east_1` alias for the
# CloudFront cert) is validated as one unit. See `infra/CLAUDE.md`.

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read
  security-events: write
  # `pull-requests: write` lets us post the `terraform validate`
  # summary as a PR comment if we ever wire one up (today the only
  # output is the workflow log + the Security tab).
  pull-requests: write

jobs:
  fmt-validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Terraform 1.6.0 ships an embedded HashiCorp PGP key that
          # expired in 2026. With v6 of the AWS provider (and any
          # other recent provider release) the install step fails with
          # `openpgp: key expired` because the older Terraform can't
          # verify the new signing key. 1.13.0+ includes the rotated
          # key. The `required_version` floor in infra/main.tf was
          # bumped to >= 1.13.0 to match.
          terraform_version: '1.13.0'
          terraform_wrapper: false

      - name: terraform fmt -check
        working-directory: infra
        run: terraform fmt -check -diff

      - name: terraform init (backend=false)
        working-directory: infra
        # `-backend=false` skips the S3 state lookup — `validate`
        # doesn't need it, and we don't want to give CI write access
        # to the prod state bucket just to run a syntax check. The
        # release-gated deploy workflows handle the real init+apply
        # under the OIDC-scoped GitHub Actions role.
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra
        run: terraform validate -no-color

  trivy-iac:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # `scan-type: config` runs the IaC ruleset across HCL / yaml
          # / json. Trivy bundles tfsec-derived checks so we get the
          # same coverage without standing up tfsec separately.
          scan-type: config
          scan-ref: infra
          # Centralised suppressions with per-line rationale live in
          # `infra/.trivyignore`. Each accepted finding documents
          # *why* it's accepted, so future audits can re-evaluate
          # per-line without re-deriving the cost/benefit reasoning.
          trivyignores: infra/.trivyignore
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH
          # Don't fail the workflow itself — let the SARIF upload step
          # surface findings via the Security tab. PR review can decide
          # whether to fix, suppress in `.trivyignore`, or accept.
          exit-code: '0'

      - name: Upload Trivy IaC SARIF
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        if: always()
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
