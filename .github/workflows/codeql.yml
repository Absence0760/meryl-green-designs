name: CodeQL

# Static analysis of our own JS/TS code. Complements .github/workflows/audit.yml
# (which only catches known CVEs in dependencies). CodeQL finds vulnerabilities
# in code we write — XSS sinks, prototype pollution, SSRF, hard-coded secrets,
# unsafe deserialisation, etc. Results land in the repo's Security tab under
# "Code scanning alerts".
#
# Triggers:
#   - pull_request to main: gate new code on a clean scan
#   - push to main: scan post-merge state, refresh the Security-tab baseline
#   - weekly cron (Sunday 06:00 UTC): catch new CodeQL queries flagging
#     existing code without waiting for a PR. Offset by ~24h from audit.yml
#     (Monday 06:00 UTC) so the two scans don't compete for hosted-runner
#     scheduler slots.
#   - workflow_dispatch: ad-hoc manual runs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JS/TS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # One language covers backend (Hono), frontend (SvelteKit), studio
          # (Sanity / React). The extractor picks up .ts, .js, .svelte, and
          # .tsx automatically.
          languages: javascript-typescript
          # No compile step — JS/TS is interpreted. Skips the autobuild
          # tracer and shaves a few minutes off each run.
          build-mode: none
          # security-and-quality is the broadest of the three suites
          # (security < security-extended < security-and-quality). For a
          # small codebase the extra noise is manageable and the
          # maintainability/correctness queries are useful.
          queries: security-and-quality

      - name: Perform analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
