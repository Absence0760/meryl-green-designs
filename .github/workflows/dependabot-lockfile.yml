name: Dependabot lockfile sync

# Dependabot updates <workspace>/package.json but never touches the root
# pnpm-lock.yaml, which breaks ci.yml's `pnpm install --frozen-lockfile`. This
# workflow regenerates the lockfile on every Dependabot PR and commits the
# result back, which retriggers CI and lets the PR go green without manual
# intervention.
#
# Setup (one-time):
#   1. Create a fine-grained PAT scoped to this repo with "Contents: Write"
#      permission (Settings → Developer settings → Personal access tokens →
#      Fine-grained tokens). Expiry up to you — rotate when it expires.
#   2. Add it as a repo secret named `DEPENDABOT_LOCKFILE_PAT`
#      (Settings → Secrets and variables → Actions → New repository secret).
#
# Why a PAT and not GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not retrigger
# workflows — GitHub blocks that path to prevent infinite loops. A PAT push is
# attributed to the token owner and does retrigger `pull_request` events, so
# ci.yml re-runs on the synced branch.

on:
  pull_request:
    paths:
      - "**/package.json"

permissions:
  contents: read

jobs:
  sync-lockfile:
    # Only run on Dependabot-authored PRs. `github.actor` is the bot username,
    # so this also neatly skips Dependabot security updates authored by a human
    # re-push if there ever is one.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # Defense in depth (closes CodeQL actions/untrusted-checkout):
          # do NOT persist the PAT into .git/config. If any step were
          # ever able to execute attacker-controlled code (e.g. a
          # postinstall script — which `--lockfile-only` already
          # blocks, but belt-and-braces), it would not be able to read
          # the token from disk. The token is supplied directly to the
          # `git push` invocation in the last step via $REMOTE_URL.
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile
        # --lockfile-only updates pnpm-lock.yaml without actually installing to
        # node_modules — pnpm does not run any lifecycle scripts in this mode.
        # --ignore-scripts is redundant here but explicit for the auditor.
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit & push if changed
        env:
          # Token used only as an env var; never written to disk.
          DEPENDABOT_LOCKFILE_PAT: ${{ secrets.DEPENDABOT_LOCKFILE_PAT }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet pnpm-lock.yaml; then
            echo "Lockfile already in sync — nothing to commit."
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm-lock.yaml"
          # Inline the token into the remote URL just for this push.
          # The token is NOT persisted into .git/config (persist-credentials: false)
          # and the URL is consumed immediately. `git push` accepts the
          # URL via positional argument in this form. The push retriggers
          # `pull_request` events because the commit is attributed to the
          # PAT owner, not github-actions.
          git push "https://x-access-token:${DEPENDABOT_LOCKFILE_PAT}@github.com/${REPO}.git" "HEAD:${PR_HEAD_REF}"
