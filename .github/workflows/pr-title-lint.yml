name: pr-title-lint

# Enforces conventional-commit-style PR titles. Catches lazy PR titles
# ("update", "fix stuff", "wip") at PR-open time so the merged history
# stays scannable.
#
# Allowed types are below in `types:`. The scope is free-form (single
# word) and optional. Subject must be 70 chars or fewer.
#
# Disable by deleting this file. Failed-check noise on a personal-project
# PR may not be worth it if you're the only contributor.

# Trigger: `pull_request_target` on purpose. A PR with merge conflicts has
# no merge ref and so gets no `pull_request` run, and its title would go
# unchecked. This is safe here because the job checks out no code, runs
# nothing from the PR, and holds only `pull-requests: read`; the action
# reads the title through the API.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, read-only token; see above
    types: [opened, edited, reopened, synchronize]

permissions: read-all

jobs:
  lint:
    name: lint title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            ci
            build
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^\.]$
          subjectPatternError: |
            The subject "{subject}" must start lowercase and not end with a period.
          headerPatternCorrespondence: type, scope, subject
