name: gitleaks

# Secret-scan every push to main, every PR, and the full history once
# a week. Catches accidentally-committed AWS keys, Sanity API tokens,
# Resend API keys, PayFast passphrase, admin tokens — anything an
# automated pattern can recognise.
#
# Complements existing controls:
#   - CodeQL (workflows/codeql.yml) — finds source-level injection
#     vulns, not secrets.
#   - pnpm audit (workflows/audit.yml) — flags CVEs in dependencies,
#     not committed secrets.
#   - SOPS + AWS KMS for the secrets we mean to keep (now stored in the
#     sibling private repo Absence0760/infra-secrets, not here) — defends
#     correctly-stored secrets, doesn't catch a stray paste.
#
# What gitleaks adds: regex-matching against the entire working tree
# AND git history, with a built-in rule set tuned for common token
# shapes (AWS, Sanity, GitHub, Resend, generic API keys, etc.).
#
# False positives go in `.gitleaks.toml` at the repo root (narrow
# regex allowlist entries only). The committed local-dev defaults in
# `backend/.env.development`, `studio/.env.development` and
# `frontend/.env.development` hold only blank / obviously-dev values
# plus PayFast's public sandbox merchant (already allowlisted), which
# the default ruleset passes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-history sweep. The push / PR triggers above only
    # diff against the base, so a secret that landed on a forgotten
    # branch and got merged via fast-forward could slip through.
    # 06:00 UTC Monday — same tide as audit.yml / codeql.yml / scorecard.yml.
    - cron: '0 6 * * 1'

permissions: read-all

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The action POSTs SARIF findings via the same security-events
      # permission CodeQL uses — keeps the Security tab the single
      # pane of glass.
      security-events: write
      # PR metadata for inline annotations.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `fetch-depth: 0` is required for the full-history scan
          # on the scheduled run. Push/PR triggers ignore the depth
          # because they have access to the base ref via the
          # workflow event itself.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is intentionally unset — public-repo free
          # tier covers everything we need.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
