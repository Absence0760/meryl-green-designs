name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # Cancel in-progress runs for the same ref — a new push supersedes the old one.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed frontend .env for typecheck
        # svelte-check imports from $env/static/public, which only exports
        # PUBLIC_* keys that exist at build time. CI has no real secrets, so
        # seed from the example to give the generated module a stable shape.
        run: cp frontend/.env.example frontend/.env

      - name: Typecheck all workspaces
        run: pnpm check

      - name: Run tests
        # Filter out the playwright workspace — its `test` script invokes
        # `playwright test` which loads playwright.config.ts, and the
        # config's env-guard throws without SANITY_PROJECT_ID etc.
        # The e2e suite is covered by e2e.yml (which provides those
        # env vars). Locally `pnpm test` still runs everything because
        # playwright/.env populates the same vars.
        run: pnpm --filter '!@meryl-green-designs/playwright' -r run test

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [test]
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
