name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # Cancel in-progress runs for the same ref — a new push supersedes the old one.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed frontend .env for typecheck
        # svelte-check imports from $env/static/public, which only exports
        # PUBLIC_* keys that exist at build time. CI has no real secrets, so
        # seed from the example to give the generated module a stable shape.
        run: cp frontend/.env.example frontend/.env

      - name: Typecheck all workspaces
        run: pnpm check

      - name: Run tests
        run: pnpm test
